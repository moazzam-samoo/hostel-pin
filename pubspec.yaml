name: hostel_finder_app
description: "Hostel Finder application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  google_maps_flutter: ^2.9.0
  url_launcher: ^6.3.0
  photo_view: ^0.15.0
  geolocator: ^13.0.1
  carousel_slider: ^5.0.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  map_launcher: ^6.0.0
  # Phase 6 (Task-6.md §6.D) pinned firebase_core ^3.6.0 / firebase_auth ^5.3.1
  # / cloud_firestore ^5.4.4 / connectivity_plus ^6.0.5. `flutter pub get`
  # resolved these newer majors instead — they are the versions compatible
  # with this project's installed Flutter/Dart SDK at implementation time and
  # its existing pins (intl ^0.19.0, get ^4.6.6, flutter_screenutil ^5.9.3);
  # no downgrade was needed to satisfy version solving, so the newer majors
  # were kept rather than force-pinning the older ones. google_sign_in stays
  # pinned at the plan's exact ^6.2.1 per §6.D/F.4 (v7 is a breaking API
  # change — GoogleSignIn.instance, no signIn()).
  firebase_core: ^4.13.0
  firebase_auth: ^6.5.7
  cloud_firestore: ^6.8.0
  google_sign_in: ^6.2.1
  connectivity_plus: ^7.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  golden_toolkit: ^0.15.0
  # Task spec calls for ^1.2.0, but that version's transitive
  # flutter_localizations/intl requirement (intl 0.20.2) conflicts with this
  # project's pinned intl ^0.19.0 — `flutter pub get` fails version solving.
  # ^3.0.0-prerelease3 is the closest version compatible with intl ^0.19.0.
  device_preview: ^3.0.0-prerelease3
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
          
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
