name: hostel_finder_app
description: "Hostel Finder application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  get: ^4.6.6
  flutter_screenutil: ^5.9.3
  cached_network_image: ^3.4.1
  flutter_svg: ^2.0.10
  shimmer: ^3.0.0
  intl: ^0.19.0
  shared_preferences: ^2.3.2
  google_maps_flutter: any
  url_launcher: ^6.3.0
  photo_view: ^0.15.0
  geolocator: ^13.0.1
  carousel_slider: ^5.0.0
  image_picker: ^1.1.2
  flutter_image_compress: ^2.3.0
  map_launcher: ^6.0.0
  firebase_core: any
  firebase_auth: any
  cloud_firestore: any
  google_sign_in: ^6.2.1
  connectivity_plus: ^7.3.1
  cloudinary_public: ^0.23.1
  dio: ^5.11.0
  geoflutterfire_plus: ^0.0.34
  path_provider: ^2.1.2
  uuid: ^4.3.3
  # Reverse-geocoding for Add Listing (FIX-7.13). Listed in IMPLEMENTATION_PLAN
  # §7.D from the start but never actually declared, which left the typed Full
  # Address and the map-pinned coordinates as two unrelated, unvalidated
  # inputs — and left `city` with no source at all (FIX-7.15).
  # Pinned to what actually resolved (was `any`, which is how a v5 breaking
  # API change — free functions replaced by instance methods on a new
  # Geocoding class — silently broke `LocationService` until caught here).
  geocoding: ^5.0.0
  # cloud_functions removed 2026-08-30 — the app no longer calls any
  # Firebase Cloud Function directly (getCloudinarySignature's client
  # call now goes to a Cloudflare Worker instead; see
  # cloudflare-worker/README.md for why). functions/index.js's two
  # exports (onHostelDeleted, sweepCloudinaryOrphans) are Firestore/
  # Pub-Sub triggers, never called via this package to begin with.
  dotted_border: ^3.1.0
  fl_chart: ^1.2.0
  rxdart: ^0.28.0
  google_maps_flutter_web: any

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  golden_toolkit: ^0.15.0
  fake_cloud_firestore: ^4.2.0
  # Task spec calls for ^1.2.0, but that version's transitive
  # flutter_localizations/intl requirement (intl 0.20.2) conflicts with this
  # project's pinned intl ^0.19.0 — `flutter pub get` fails version solving.
  # ^3.0.0-prerelease3 is the closest version compatible with intl ^0.19.0.
  device_preview: ^3.0.0-prerelease3
flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/illustrations/
    
  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
          
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600

flutter_launcher_icons:
  android: true
  ios: true
  # assets/images/app_icon.png = app_logo.png (pin + map) on white with padding;
  # app_icon_foreground.png = same mark inside the adaptive-icon safe zone.
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/images/app_icon_foreground.png"
  web:
    generate: true
    image_path: "assets/images/app_icon.png"
    background_color: "#FFFFFF"
    theme_color: "#F97316"
